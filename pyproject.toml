[project]
name = "nice-dialogs"
description = "Package containing reusable general-purpose NiceGUI dialogs"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "nicegui >= 3.16, <4",
    "pydantic-extra-types[cron] >= 2.10.6",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "faker",
    "mypy",
    "prek",
    "pytest >= 9",
    "pytest-asyncio",
    "pytest-cov",
    "python-semantic-release >= 10.7, < 11",
    "pywebview",
    "ruff",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nice_dialogs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.uv]
required-version = ">=0.13.6"
trusted-publishing = "always"
upgrade = true
# The version is derived from git tags, so refresh the editable install on new tags
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.semantic_release]
tag_format = "{version}"
allow_zero_version = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''^chore(\([^)]*\))?!?:''',
    '''^Merge ''',
]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.release]
match = "release/.*"
prerelease = false

[tool.mypy]
strict = true

[tool.pytest]
asyncio_mode = "auto"
addopts = ["--cov=nice_dialogs",  "--cov-fail-under=90", "-p nicegui.testing.user_plugin"]
testpaths = ["tests"]
main_file = "examples/main.py"  # NiceGUI Test Plugin

[tool.ruff.lint]
ignore = [
    "COM812",
]

select = [
    "E",
    "F",
    "N",
    "W",
    "COM",
    "FBT",
    "UP",
    "ASYNC",
    "DTZ",
    "ERA",
    "PTH",
    "FAST",
    "FURB",
    "PERF",
    "EM102",
    "G004",
    "T20",
    "LOG",
    "RUF100",
]
