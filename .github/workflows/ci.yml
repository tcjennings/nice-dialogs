name: CI

"on":
  workflow_call:
  pull_request:

env:
  UV_MANAGED_PYTHON: "1"
  UV_FROZEN: "1"

jobs:
  commitlint:
    uses: tcjennings/actions-workflows/.github/workflows/commitlint.yaml@main
    with:
      verbose: true

  lint:
    needs: commitlint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nicegui-version: ["3.16", "3.17", "3.18"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "latest-known"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Linters
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0

      - name: Type check with mypy
        run: uv run --with "nicegui==${{ matrix.nicegui-version }}.*" --isolated mypy -p nice_dialogs

  test-matrix:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
        nicegui-version: ["3.16", "3.17", "3.18"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "latest-known"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install NiceGUI
        run: uv pip install "nicegui==${{ matrix.nicegui-version }}.*"

      - name: Run tests
        run: uv run pytest

  test:
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Test Matrix Passed
        run: echo "Testing Matrix has passed."
